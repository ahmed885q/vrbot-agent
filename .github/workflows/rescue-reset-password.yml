name: Rescue - Reset Root Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into rescue and reset root password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: nN8%vFp8Mip8eP
          port: 22
          command_timeout: 3m
          script: |
            echo "===== RESCUE MODE ======"
            hostname
            uname -a
            echo ""
            echo "===== DISK LAYOUT ======"
            lsblk
            echo ""
            echo "===== MOUNT FILESYSTEMS ======"
            # Try common partition layouts
            if [ -e /dev/md1 ]; then
              mount /dev/md1 /mnt 2>/dev/null && echo "Mounted /dev/md1" || true
            elif [ -e /dev/sda1 ]; then
              mount /dev/sda1 /mnt 2>/dev/null && echo "Mounted /dev/sda1" || true
            elif [ -e /dev/nvme0n1p1 ]; then
              mount /dev/nvme0n1p1 /mnt 2>/dev/null && echo "Mounted /dev/nvme0n1p1" || true
            fi

            # Check if mount worked
            if [ -f /mnt/etc/shadow ]; then
              echo "Filesystem mounted successfully!"
              echo ""
              echo "===== CHANGE ROOT PASSWORD ======"
              # Set new password: VrBot@Cloud2024!
              chroot /mnt /bin/bash -c 'echo "root:VrBot@Cloud2024!" | chpasswd'
              echo "Password changed successfully!"
              echo ""
              echo "===== VERIFY ======"
              grep root /mnt/etc/shadow | head -1 | cut -d: -f1-2 | head -c 20
              echo "..."
              echo ""
              echo "===== REBOOT TO NORMAL MODE ======"
              # Unmount and reboot
              umount /mnt 2>/dev/null || true
              reboot &
              echo "Reboot initiated!"
            else
              echo "ERROR: Could not mount filesystem!"
              echo "Trying to find the right partition..."
              fdisk -l 2>/dev/null | head -40
              cat /proc/mdstat 2>/dev/null
              ls /dev/sd* /dev/nvme* /dev/md* 2>/dev/null
            fi
