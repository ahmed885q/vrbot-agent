name: Rescue - Reset Root Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into rescue and reset root password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: "iVErGPp%B5jRcb"
          port: 22
          command_timeout: 3m
          script: |
            echo "===== RESCUE MODE ======"
            hostname
            echo ""
            echo "===== DISK LAYOUT ======"
            lsblk
            cat /proc/mdstat
            echo ""
            echo "===== TRY ALL MD DEVICES ======"
            for dev in md0 md2; do
              echo "--- Trying /dev/$dev ---"
              mkdir -p /mnt/$dev
              mount /dev/$dev /mnt/$dev 2>&1 || continue
              if [ -f /mnt/$dev/etc/shadow ]; then
                echo "FOUND ROOT at /dev/$dev!"
                echo "Changing password..."
                chroot /mnt/$dev /bin/bash -c 'echo root:VrBotCloud2024 | chpasswd' 2>&1
                echo "Verifying..."
                grep root /mnt/$dev/etc/shadow | head -1 | cut -c1-30
                echo "Done! Unmounting..."
                umount /mnt/$dev
                echo "SUCCESS"
                exit 0
              else
                echo "Not root filesystem, contents:"
                ls /mnt/$dev/ 2>/dev/null | head -10
                umount /mnt/$dev 2>/dev/null
              fi
            done
            echo "FAILED: Could not find root filesystem"
            exit 1

      - name: Reboot server to normal mode
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: 88.99.64.19
          username: root
          password: "iVErGPp%B5jRcb"
          port: 22
          command_timeout: 1m
          script: |
            echo "Rebooting..."
            reboot
