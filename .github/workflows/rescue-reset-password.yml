name: Rescue - Reset Root Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into rescue and reset root password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: "nN8%vFp8Mip8eP"
          port: 22
          command_timeout: 3m
          script: |
            echo "===== RESCUE MODE ======"
            hostname
            echo ""
            echo "===== TRY MOUNTING ROOT ======"
            # md0 = 31GB root, md1 = 1GB swap, md2 = 444GB data
            mount /dev/md0 /mnt && echo "Mounted /dev/md0 (root)"
            ls /mnt/etc/shadow && echo "Found shadow file!"
            echo ""
            echo "===== CHANGE ROOT PASSWORD ======"
            chroot /mnt /bin/bash -c 'echo "root:VrBot@Cloud2024!" | chpasswd'
            echo "Password changed successfully!"
            echo ""
            echo "===== VERIFY ======"
            grep root /mnt/etc/shadow | head -1 | cut -c1-25
            echo "..."
            echo ""
            echo "===== UNMOUNT AND REBOOT ======"
            umount /mnt
            echo "Rebooting to normal mode..."
            reboot &
