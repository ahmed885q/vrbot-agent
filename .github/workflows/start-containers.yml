name: Start Farm Containers

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Check and start Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            echo "===== DOCKER STATUS ======"
            docker --version
            systemctl status docker | head -5
            echo ""
            echo "===== ALL CONTAINERS (running + stopped) ======"
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"
            echo ""
            echo "===== STARTING ALL STOPPED CONTAINERS ======"
            stopped=$(docker ps -a --filter "status=exited" --filter "status=created" -q)
            if [ -n "$stopped" ]; then
              echo "Found stopped containers, starting them..."
              docker start $stopped
              echo ""
              echo "===== AFTER START ======"
              sleep 5
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            else
              echo "No stopped containers to start"
            fi
            echo ""
            echo "===== DOCKER COMPOSE FILES ======"
            find / -name "docker-compose*.yml" -not -path "*/proc/*" -not -path "*/sys/*" 2>/dev/null | head -10
            echo ""
            echo "===== RESTART POLICIES ======"
            docker inspect --format '{{.Name}} -> {{.HostConfig.RestartPolicy.Name}}' $(docker ps -aq) 2>/dev/null
