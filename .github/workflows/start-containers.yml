name: Start Farm Containers

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start all farm containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            echo "===== KERNEL MODULES ======"
            lsmod | grep -E 'binder|ashmem' || echo "No binder/ashmem modules"
            modprobe binder_linux 2>&1 || echo "binder_linux module failed"
            modprobe ashmem_linux 2>&1 || echo "ashmem_linux module failed"
            ls /dev/binder* /dev/ashmem* 2>/dev/null || echo "No binder/ashmem devices"
            echo ""
            echo "===== STARTING ALL CONTAINERS ONE BY ONE ======"
            for c in $(docker ps -a --format '{{.Names}}' | sort); do
              status=$(docker inspect --format '{{.State.Status}}' $c)
              if [ "$status" != "running" ]; then
                echo -n "Starting $c... "
                docker start $c 2>&1 && echo "OK" || echo "FAILED"
              else
                echo "$c is already running"
              fi
            done
            echo ""
            sleep 10
            echo "===== FINAL STATUS ======"
            docker ps -a --format "table {{.Names}}\t{{.Status}}" | head -25
            echo ""
            echo "===== SET RESTART POLICY ======"
            for c in $(docker ps -a --format '{{.Names}}'); do
              docker update --restart unless-stopped $c 2>&1
            done
            echo "Restart policies updated"
