name: Deploy WS Hub
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy WS Hub to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            echo "=== Deploying VRBOT WebSocket Hub ==="

            # Install websockets (--break-system-packages for PEP 668)
            pip3 install websockets --break-system-packages --quiet 2>/dev/null || apt-get install -y python3-websockets 2>/dev/null || true

            # Create directory
            mkdir -p /opt/vrbot/ws_hub

            # Download ws_hub.py from GitHub
            curl -sL https://raw.githubusercontent.com/ahmed885q/vrbot-agent/main/ws/ws_hub.py -o /opt/vrbot/ws_hub/ws_hub.py
            chmod +x /opt/vrbot/ws_hub/ws_hub.py

            # Create SSL service
            cat > /etc/systemd/system/vrbot-ws-hub.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub (SSL)
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 443 --ssl
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC

            # Create fallback service (no SSL)
            cat > /etc/systemd/system/vrbot-ws-hub-fallback.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub (fallback)
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 8765
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC

            # Start services
            systemctl daemon-reload
            systemctl enable --now vrbot-ws-hub.service
            systemctl enable --now vrbot-ws-hub-fallback.service
            sleep 2

            systemctl status vrbot-ws-hub.service --no-pager || true
            systemctl status vrbot-ws-hub-fallback.service --no-pager || true
            curl -s http://localhost:8765/health || echo "Health check pending..."
            echo "=== Deployment Complete ==="
