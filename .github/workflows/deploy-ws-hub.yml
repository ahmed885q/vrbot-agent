name: Deploy WS Hub
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy WS Hub to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            echo "=== Deploying VRBOT WebSocket Hub ==="

            # Install websockets
            pip3 install websockets --break-system-packages --quiet 2>/dev/null || apt-get install -y python3-websockets 2>/dev/null || true

            # Open firewall ports
            if command -v ufw &>/dev/null; then
              ufw allow 8765/tcp 2>/dev/null || true
              ufw allow 443/tcp 2>/dev/null || true
            fi
            iptables -I INPUT -p tcp --dport 8765 -j ACCEPT 2>/dev/null || true
            iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || true

            # Create directory
            mkdir -p /opt/vrbot/ws_hub

            # Download ws_hub.py from GitHub
            curl -sL https://raw.githubusercontent.com/ahmed885q/vrbot-agent/main/ws/ws_hub.py -o /opt/vrbot/ws_hub/ws_hub.py
            chmod +x /opt/vrbot/ws_hub/ws_hub.py

            # Stop old services if running
            systemctl stop vrbot-ws-hub.service 2>/dev/null || true
            systemctl stop vrbot-ws-hub-fallback.service 2>/dev/null || true

            # Create SSL service
            cat > /etc/systemd/system/vrbot-ws-hub.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub (SSL)
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 443 --ssl
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC

            # Create fallback service (no SSL)
            cat > /etc/systemd/system/vrbot-ws-hub-fallback.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub (fallback)
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 8765
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC

            # Start services
            systemctl daemon-reload
            systemctl enable --now vrbot-ws-hub.service
            systemctl enable --now vrbot-ws-hub-fallback.service
            sleep 3

            # Verify
            echo "=== Service Status ==="
            systemctl is-active vrbot-ws-hub.service && echo "SSL service: RUNNING" || echo "SSL service: STOPPED"
            systemctl is-active vrbot-ws-hub-fallback.service && echo "Fallback service: RUNNING" || echo "Fallback service: STOPPED"
            
            echo "=== Health Check ==="
            curl -s http://localhost:8765/health && echo "" || echo "Health: no response (checking logs...)"
            journalctl -u vrbot-ws-hub-fallback.service -n 10 --no-pager 2>/dev/null || true
            
            echo "=== Port Check ==="
            ss -tlnp | grep -E '8765|443' || echo "No listeners found"
            
            echo "=== Deployment Complete ==="
