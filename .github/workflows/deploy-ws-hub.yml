name: Deploy WS Hub
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy WS Hub to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "=== Deploying VRBOT WebSocket Hub ==="
            
            # Install websockets
            pip3 install websockets --quiet 2>/dev/null || pip install websockets --quiet
            
            # Create directory
            mkdir -p /opt/vrbot/ws_hub
            
            # Download ws_hub.py from GitHub
            curl -sL https://raw.githubusercontent.com/ahmed885q/vrbot-agent/main/ws/ws_hub.py -o /opt/vrbot/ws_hub/ws_hub.py
            chmod +x /opt/vrbot/ws_hub/ws_hub.py
            
            # Install certbot for SSL
            which certbot || (apt-get update -qq && apt-get install -y -qq certbot > /dev/null 2>&1)
            
            # Get SSL certificate (if not exists)
            CERT="/etc/letsencrypt/live/ws.vrbot.me/fullchain.pem"
            if [ ! -f "$CERT" ]; then
              # Stop anything on port 80 temporarily
              systemctl stop nginx 2>/dev/null || true
              certbot certonly --standalone --non-interactive --agree-tos \
                --email ahmed885q@gmail.com \
                -d ws.vrbot.me \
                --preferred-challenges http || echo "SSL failed - will use non-SSL"
              systemctl start nginx 2>/dev/null || true
            fi
            
            # Create systemd service (SSL)
            cat > /etc/systemd/system/vrbot-ws-hub.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 443 --ssl
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC
            
            # Create fallback service (no SSL)
            cat > /etc/systemd/system/vrbot-ws-hub-fallback.service << 'SVC'
            [Unit]
            Description=VRBOT WebSocket Hub (fallback)
            After=network.target
            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/vrbot/ws_hub
            ExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 8765
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1
            [Install]
            WantedBy=multi-user.target
            SVC
            
            # Start services
            systemctl daemon-reload
            systemctl enable --now vrbot-ws-hub.service
            systemctl enable --now vrbot-ws-hub-fallback.service
            
            sleep 2
            systemctl status vrbot-ws-hub.service --no-pager || true
            systemctl status vrbot-ws-hub-fallback.service --no-pager || true
            curl -s http://localhost:8765/health || echo "Health check pending..."
            echo "=== Deployment Complete ==="
