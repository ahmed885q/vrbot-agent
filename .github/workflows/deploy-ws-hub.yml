name: Deploy WS Hub
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy ws_hub.py to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "ws/ws_hub.py"
          target: "/opt/vrbot/ws_hub/"
          strip_components: 1

      - name: Configure and restart ws_hub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 3m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY
          script: |
            set -e
            echo "=== Step 0: Install dependencies ==="
            pip3 install websockets --break-system-packages --quiet 2>/dev/null || pip3 install websockets --quiet 2>/dev/null || true
            echo "=== Step 1: Verify ws_hub.py ==="
            head -3 /opt/vrbot/ws_hub/ws_hub.py
            echo "=== Step 2: Write env file ==="
            echo "SUPABASE_URL=${SUPABASE_URL}" > /opt/vrbot/ws_hub/.env
            echo "SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}" >> /opt/vrbot/ws_hub/.env
            echo "REQUIRE_AGENT_TOKEN=false" >> /opt/vrbot/ws_hub/.env
            echo "=== Step 3: Write systemd units ==="
            printf '[Unit]\nDescription=VRBOT WS Hub SSL\nAfter=network.target\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/opt/vrbot/ws_hub\nExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 443 --ssl\nRestart=always\nRestartSec=5\nEnvironmentFile=/opt/vrbot/ws_hub/.env\nEnvironment=PYTHONUNBUFFERED=1\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vrbot-ws-hub.service
            printf '[Unit]\nDescription=VRBOT WS Hub Fallback\nAfter=network.target\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/opt/vrbot/ws_hub\nExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 8765\nRestart=always\nRestartSec=5\nEnvironmentFile=/opt/vrbot/ws_hub/.env\nEnvironment=PYTHONUNBUFFERED=1\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vrbot-ws-hub-fallback.service
            echo "=== Step 4: Reload and restart ==="
            systemctl daemon-reload
            systemctl restart vrbot-ws-hub-fallback.service || systemctl start vrbot-ws-hub-fallback.service || true
            systemctl restart vrbot-ws-hub.service || systemctl start vrbot-ws-hub.service || true
            systemctl enable vrbot-ws-hub.service vrbot-ws-hub-fallback.service 2>/dev/null || true
            sleep 6
            echo "=== Status ==="
            systemctl is-active vrbot-ws-hub-fallback.service && echo "Fallback: OK" || echo "Fallback: FAIL"
            systemctl is-active vrbot-ws-hub.service && echo "SSL: OK" || echo "SSL: FAIL"
            echo "=== Fallback logs ==="
            journalctl -u vrbot-ws-hub-fallback.service -n 10 --no-pager 2>/dev/null || true
            curl -s http://localhost:8765/health || echo "No health response yet"
            echo "=== Done ==="
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
