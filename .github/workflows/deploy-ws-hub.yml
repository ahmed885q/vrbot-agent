name: Deploy WS Hub
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy WS Hub to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: SUPABASE_URL,SUPABASE_SERVICE_KEY
          script: |
            echo "=== Deploying VRBOT WebSocket Hub ==="
            pip3 install websockets --break-system-packages --quiet 2>/dev/null || true
            iptables -I INPUT -p tcp --dport 8765 -j ACCEPT 2>/dev/null || true
            iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || true
            mkdir -p /opt/vrbot/ws_hub
            curl -sL https://raw.githubusercontent.com/ahmed885q/vrbot-agent/main/ws/ws_hub.py -o /opt/vrbot/ws_hub/ws_hub.py
            chmod +x /opt/vrbot/ws_hub/ws_hub.py
            systemctl stop vrbot-ws-hub.service 2>/dev/null || true
            systemctl stop vrbot-ws-hub-fallback.service 2>/dev/null || true
            kill $(pgrep -f "python3 /opt/vrbot/ws_hub/ws_hub.py") 2>/dev/null || true
            sleep 1
            echo "SUPABASE_URL=${SUPABASE_URL}" > /opt/vrbot/ws_hub/.env
            echo "SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}" >> /opt/vrbot/ws_hub/.env
            echo "REQUIRE_AGENT_TOKEN=false" >> /opt/vrbot/ws_hub/.env
            printf '[Unit]\nDescription=VRBOT WebSocket Hub (SSL)\nAfter=network.target\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/opt/vrbot/ws_hub\nExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 443 --ssl\nRestart=always\nRestartSec=5\nEnvironmentFile=/opt/vrbot/ws_hub/.env\nEnvironment=PYTHONUNBUFFERED=1\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vrbot-ws-hub.service
            printf '[Unit]\nDescription=VRBOT WebSocket Hub (fallback)\nAfter=network.target\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/opt/vrbot/ws_hub\nExecStart=/usr/bin/python3 /opt/vrbot/ws_hub/ws_hub.py --port 8765\nRestart=always\nRestartSec=5\nEnvironmentFile=/opt/vrbot/ws_hub/.env\nEnvironment=PYTHONUNBUFFERED=1\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/vrbot-ws-hub-fallback.service
            systemctl daemon-reload
            systemctl enable --now vrbot-ws-hub.service || true
            systemctl enable --now vrbot-ws-hub-fallback.service || true
            sleep 2
            echo "=== Service Status ==="
            systemctl is-active vrbot-ws-hub.service && echo "SSL: RUNNING" || echo "SSL: STOPPED"
            systemctl is-active vrbot-ws-hub-fallback.service && echo "Fallback: RUNNING" || echo "Fallback: STOPPED"
            curl -s http://localhost:8765/health || echo "Health: no response"
            echo "=== Done ==="
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
