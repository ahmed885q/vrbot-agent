name: Deploy Orchestrator
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy orchestrator files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "orchestrator/"
          target: "/opt/vrbot/orchestrator/"
          strip_components: 1

      - name: Setup and start orchestrator
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            echo "===== Install dependencies ====="
            pip3 install fastapi uvicorn pydantic --break-system-packages --quiet 2>/dev/null || \
            pip3 install fastapi uvicorn pydantic --quiet 2>/dev/null || true

            # Install sshpass for SSH password auth to cloud server
            apt-get install -y sshpass 2>/dev/null || true

            echo "===== Verify files ====="
            ls -la /opt/vrbot/orchestrator/
            head -3 /opt/vrbot/orchestrator/api.py

            echo "===== Configure .env ====="
            cat > /opt/vrbot/orchestrator/.env << 'ENVEOF'
            CLOUD_SERVER_PASSWORD=${{ secrets.CLOUD_SERVER_PASSWORD }}
            CLOUD_SERVER_IP=88.99.64.19
            AUTO_DISCOVER=true
            HETZNER_TOKEN=
            ENVEOF
            echo ".env configured with cloud server credentials"

            echo "===== Setup SSH known hosts ====="
            ssh-keyscan -H 88.99.64.19 >> /root/.ssh/known_hosts 2>/dev/null || true

            echo "===== Create systemd service ====="
            cat > /etc/systemd/system/vrbot-orchestrator.service << 'SVCEOF'
            [Unit]
            Description=VRBOT Orchestrator API
            After=network.target
            Wants=network-online.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/vrbot/orchestrator
            EnvironmentFile=/opt/vrbot/orchestrator/.env
            ExecStart=/usr/bin/python3 -m uvicorn api:app --host 0.0.0.0 --port 8080 --log-level info
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            echo "===== Start service ====="
            systemctl daemon-reload
            systemctl enable vrbot-orchestrator.service
            systemctl restart vrbot-orchestrator.service
            sleep 8

            echo "===== Check status ====="
            systemctl is-active vrbot-orchestrator.service && echo "Orchestrator: OK" || echo "Orchestrator: FAIL"
            journalctl -u vrbot-orchestrator.service -n 30 --no-pager

            echo "===== Health check ====="
            sleep 3
            curl -s http://localhost:8080/api/health || echo "Health check pending..."
            echo ""

            echo "===== Farm discovery check ====="
            curl -s http://localhost:8080/api/farms | python3 -m json.tool 2>/dev/null | head -30 || echo "Farm list pending..."
