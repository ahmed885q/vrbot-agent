name: Fix Networks & Launch Game

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate all broken farms with data preserved
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== RECREATE BROKEN FARMS ======"
            for c in $(docker ps -a --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c 2>/dev/null)
              if [ -n "$ip" ] && [ "$ip" != "" ]; then
                echo "$c: already has IP=$ip, skipping"
                continue
              fi

              echo -n "$c: recreating... "
              # Stop and remove
              docker stop $c 2>/dev/null
              docker rm $c 2>/dev/null

              # Recreate with same config + data bind mount
              docker run -d --name $c \
                --privileged \
                --network bridge \
                --security-opt label=disable \
                -v /root/farm-data/$c:/data \
                -v /root/touch:/system/bin/vrbot-touch:ro \
                redroid/redroid:11.0.0-latest \
                androidboot.redroid_gpu_mode=host \
                androidboot.redroid_width=720 \
                androidboot.redroid_height=1280 \
                androidboot.redroid_fps=10 \
                ro.setupwizard.mode=DISABLED 2>&1 | tail -c 12

              # Set restart policy
              docker update --restart unless-stopped $c 2>/dev/null

              echo " OK"
              sleep 1
            done
            echo ""

            sleep 20

            echo "===== VERIFY ALL FARMS ======"
            ok=0
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              status=$(docker inspect --format '{{.State.Status}}' $c)
              echo "$c: status=$status ip=$ip"
              [ -n "$ip" ] && ok=$((ok + 1))
            done
            echo "Total with IP: $ok"
            echo ""

            echo "===== CONNECT ADB & LAUNCH GAME ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              [ -z "$ip" ] && continue
              adb connect $ip:5555 2>/dev/null | tail -1
            done
            sleep 5

            DEVS=$(adb devices | grep "device$" | wc -l)
            echo "ADB devices connected: $DEVS"
            echo ""

            for dev in $(adb devices | grep "device$" | awk '{print $1}'); do
              echo -n "Launch $dev: "
              adb -s $dev shell monkey -p $GAME_PKG -c android.intent.category.LAUNCHER 1 2>&1 | grep -c "Events injected" | xargs -I{} echo "launched"
            done
            echo ""
            echo "===== DONE ======"
