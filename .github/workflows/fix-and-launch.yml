name: Fix Networks & Launch Game

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and recreate broken farms
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== INSPECT FARM_001 (working) vs FARM_002 (broken) ======"
            echo "--- farm_001 Mounts ---"
            docker inspect farm_001 --format '{{json .Mounts}}' | python3 -m json.tool 2>/dev/null
            echo ""
            echo "--- farm_002 Mounts ---"
            docker inspect farm_002 --format '{{json .Mounts}}' | python3 -m json.tool 2>/dev/null
            echo ""
            echo "--- farm_001 HostConfig.Binds ---"
            docker inspect farm_001 --format '{{json .HostConfig.Binds}}' 2>/dev/null
            echo ""
            echo "--- farm_002 HostConfig.Binds ---"
            docker inspect farm_002 --format '{{json .HostConfig.Binds}}' 2>/dev/null
            echo ""
            echo "--- farm_001 HostConfig.Devices ---"
            docker inspect farm_001 --format '{{json .HostConfig.Devices}}' 2>/dev/null
            echo ""
            echo "--- farm_001 Full create command reconstruction ---"
            docker inspect farm_001 --format '
            Image: {{.Config.Image}}
            Cmd: {{json .Config.Cmd}}
            Privileged: {{.HostConfig.Privileged}}
            NetworkMode: {{.HostConfig.NetworkMode}}
            SecurityOpt: {{json .HostConfig.SecurityOpt}}
            Tmpfs: {{json .HostConfig.Tmpfs}}
            ' 2>/dev/null
            echo ""
            echo "--- farm_002 Full ---"
            docker inspect farm_002 --format '
            Image: {{.Config.Image}}
            Cmd: {{json .Config.Cmd}}
            Privileged: {{.HostConfig.Privileged}}
            NetworkMode: {{.HostConfig.NetworkMode}}
            SecurityOpt: {{json .HostConfig.SecurityOpt}}
            Tmpfs: {{json .HostConfig.Tmpfs}}
            ' 2>/dev/null
            echo ""

            echo "===== CHECK DATA VOLUMES ======"
            docker volume ls | head -30
            echo ""

            echo "===== RECREATE FARM_002 AS TEST ======"
            # Stop and remove farm_002
            docker stop farm_002 2>/dev/null
            docker rm farm_002 2>/dev/null

            # Recreate with same settings as farm_001 but named farm_002
            docker run -d --name farm_002 \
              --privileged \
              --network bridge \
              redroid/redroid:11.0.0-latest \
              androidboot.redroid_gpu_mode=host \
              androidboot.redroid_width=720 \
              androidboot.redroid_height=1280 \
              androidboot.redroid_fps=10 \
              ro.setupwizard.mode=DISABLED

            sleep 10

            ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' farm_002)
            echo "farm_002 new IP: $ip"

            if [ -n "$ip" ]; then
              adb connect $ip:5555 2>&1
              sleep 3
              echo "Checking game..."
              adb -s $ip:5555 shell pm list packages 2>/dev/null | grep -i viking
            fi
