name: Fix Networks & Launch Game

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Restart broken farms and launch game
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== RESTART FARMS WITH NO NETWORK ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              nets=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              if [ -z "$nets" ]; then
                echo -n "$c: restarting... "
                docker restart $c --time 10 2>&1 | tail -1
                sleep 2
              else
                echo "$c: OK (IP=$nets)"
              fi
            done
            echo ""

            sleep 10

            echo "===== VERIFY ALL IPs ======"
            ok=0
            fail=0
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              if [ -n "$ip" ]; then
                echo "$c: IP=$ip"
                ok=$((ok + 1))
              else
                echo "$c: NO IP!"
                fail=$((fail + 1))
              fi
            done
            echo "OK: $ok  FAILED: $fail"
            echo ""

            echo "===== CONNECT ADB ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              if [ -n "$ip" ]; then
                adb connect $ip:5555 2>&1 | tail -1
              fi
            done
            echo ""

            sleep 5
            DEVICE_COUNT=$(adb devices | grep "device$" | wc -l)
            echo "Connected devices: $DEVICE_COUNT"
            echo ""

            if [ "$DEVICE_COUNT" -gt 0 ]; then
              echo "===== LAUNCH GAME ON ALL ======"
              for dev in $(adb devices | grep "device$" | awk '{print $1}'); do
                echo -n "$dev: "
                result=$(adb -s $dev shell monkey -p $GAME_PKG -c android.intent.category.LAUNCHER 1 2>&1)
                echo "$result" | grep -oE "Events injected|No activities" | head -1
              done
            fi
            echo ""
            echo "===== DONE ======"
