name: Fix Networks & Launch Game

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Reconnect farms to bridge network and launch game
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== FIX: RECONNECT FARMS TO BRIDGE ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              nets=$(docker inspect --format '{{json .NetworkSettings.Networks}}' $c)
              if [ "$nets" = "{}" ] || [ "$nets" = "null" ]; then
                echo -n "$c: no network, reconnecting... "
                docker network connect bridge $c 2>&1 && echo "OK" || echo "FAILED"
              else
                ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
                echo "$c: already connected (IP=$ip)"
              fi
            done
            echo ""

            sleep 3

            echo "===== VERIFY IPs ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              echo "$c: IP=$ip"
            done
            echo ""

            echo "===== CONNECT ADB ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              if [ -n "$ip" ]; then
                adb connect $ip:5555 2>&1 | tail -1
              fi
            done
            echo ""

            sleep 5
            DEVICE_COUNT=$(adb devices | grep "device$" | wc -l)
            echo "Connected devices: $DEVICE_COUNT"
            echo ""

            echo "===== LAUNCH GAME ======"
            for dev in $(adb devices | grep "device$" | awk '{print $1}'); do
              echo -n "$dev: "
              adb -s $dev shell monkey -p $GAME_PKG -c android.intent.category.LAUNCHER 1 2>&1 | grep -E "Events|No activities" | head -1
            done
            echo ""

            echo "===== DONE ======"
