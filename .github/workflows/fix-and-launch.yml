name: Fix Networks & Launch Game

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Docker and launch game
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== STEP 1: STOP ALL CONTAINERS ======"
            docker stop $(docker ps -q) 2>/dev/null
            echo "All stopped"
            sleep 3

            echo "===== STEP 2: RESTART DOCKER SERVICE ======"
            systemctl restart docker
            sleep 5
            systemctl status docker | head -3
            echo ""

            echo "===== STEP 3: START ALL CONTAINERS ======"
            for c in $(docker ps -a --format '{{.Names}}' | sort); do
              echo -n "$c: "
              docker start $c 2>&1 | tail -1
              sleep 1
            done
            echo ""

            sleep 15

            echo "===== STEP 4: VERIFY IPs ======"
            ok=0
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              if [ -n "$ip" ]; then
                echo "$c: $ip"
                ok=$((ok + 1))
              else
                echo "$c: NO IP"
              fi
            done
            echo "Farms with IP: $ok / 20"
            echo ""

            echo "===== STEP 5: CONNECT ADB ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c)
              [ -n "$ip" ] && adb connect $ip:5555 2>&1 | tail -1
            done
            sleep 5
            DEVS=$(adb devices | grep "device$" | wc -l)
            echo "ADB devices: $DEVS"
            echo ""

            echo "===== STEP 6: LAUNCH GAME ======"
            for dev in $(adb devices | grep "device$" | awk '{print $1}'); do
              echo -n "$dev: "
              adb -s $dev shell monkey -p $GAME_PKG -c android.intent.category.LAUNCHER 1 2>&1 | grep -c "Events injected" | xargs -I{} echo "OK"
            done
            echo ""
            echo "===== DONE ======"
