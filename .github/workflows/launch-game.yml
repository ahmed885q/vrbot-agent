name: Launch Viking Rise on All Farms

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch game on all farms
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 88.99.64.19
          username: root
          password: ${{ secrets.CLOUD_SERVER_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            GAME_PKG="com.igg.android.vikingriseglobal"

            echo "===== CONNECT ADB TO ALL FARMS ======"
            for c in $(docker ps --format '{{.Names}}' | sort); do
              # Get IP from all possible network configs
              ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $c 2>/dev/null)
              if [ -z "$ip" ]; then
                ip=$(docker inspect --format '{{.NetworkSettings.IPAddress}}' $c 2>/dev/null)
              fi
              if [ -n "$ip" ] && [ "$ip" != "" ]; then
                echo -n "$c ($ip): "
                adb connect $ip:5555 2>&1 | tail -1
              else
                echo "$c: NO IP - trying via docker exec..."
                # Get IP from inside container
                ip=$(docker exec $c ip addr show eth0 2>/dev/null | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
                if [ -n "$ip" ]; then
                  echo -n "  Found $ip: "
                  adb connect $ip:5555 2>&1 | tail -1
                else
                  echo "  Could not find IP"
                fi
              fi
            done
            echo ""

            sleep 5
            echo "===== CONNECTED DEVICES ======"
            adb devices | grep device | grep -v "List"
            DEVICE_COUNT=$(adb devices | grep "device$" | wc -l)
            echo "Total connected: $DEVICE_COUNT"
            echo ""

            echo "===== LAUNCH GAME ON ALL DEVICES ======"
            for dev in $(adb devices | grep "device$" | awk '{print $1}'); do
              echo -n "$dev: "
              adb -s $dev shell monkey -p $GAME_PKG -c android.intent.category.LAUNCHER 1 2>&1 | tail -1
            done
            echo ""

            echo "===== DONE ======"
