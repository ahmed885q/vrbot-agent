name: Check Server Status
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check running processes on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            echo "===== RUNNING PROCESSES ====="
            ps aux | grep -iE 'python|node|register|signup|email|account|gsmini|vrbot|selenium|playwright|puppeteer' | grep -v grep
            echo ""
            echo "===== SYSTEMD SERVICES (vrbot) ====="
            systemctl list-units --type=service | grep -i vrbot
            echo ""
            echo "===== SCREEN/TMUX SESSIONS ====="
            screen -ls 2>/dev/null || echo "No screen sessions"
            tmux ls 2>/dev/null || echo "No tmux sessions"
            echo ""
            echo "===== CRON JOBS ====="
            crontab -l 2>/dev/null || echo "No cron jobs"
            echo ""
            echo "===== PM2 PROCESSES ====="
            pm2 list 2>/dev/null || echo "No pm2"
            echo ""
            echo "===== DOCKER CONTAINERS ====="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>/dev/null || echo "No docker"
            echo ""
            echo "===== /opt/vrbot/ CONTENTS ====="
            ls -la /opt/vrbot/ 2>/dev/null || echo "No /opt/vrbot"
            echo ""
            echo "===== NOHUP / LOG FILES ====="
            ls -la /opt/vrbot/*.log /opt/vrbot/nohup.out /root/nohup.out /tmp/*register* /tmp/*signup* 2>/dev/null || echo "No log files found"
            echo ""
            echo "===== RECENT PYTHON FILES ====="
            find /opt/vrbot /root -name "*.py" -mtime -30 -type f 2>/dev/null | head -30
