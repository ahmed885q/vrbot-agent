name: Check Server Status
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check running processes on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.214.187
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            echo "===== CREATE_TOUCH.PY CONTENT ====="
            cat /tmp/create_touch.py 2>/dev/null || echo "File not found"
            echo ""
            echo "===== CREATE_TOUCH PROCESS INFO ====="
            ps aux | grep create_touch | grep -v grep
            echo ""
            echo "===== FILES IN /tmp/ related ====="
            ls -la /tmp/create* /tmp/account* /tmp/email* /tmp/register* /tmp/*.json /tmp/*.csv /tmp/*.txt 2>/dev/null | head -30
            echo ""
            echo "===== LAST 50 LINES OF ANY LOG ====="
            find /tmp -name "*.log" -newer /tmp/create_touch.py 2>/dev/null -exec echo "--- {} ---" \; -exec tail -20 {} \;
            echo ""
            echo "===== /root/ relevant files ====="
            ls -la /root/*.py /root/*.sh /root/*.json /root/*.csv /root/*.log 2>/dev/null | head -20
